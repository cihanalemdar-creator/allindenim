  <text x="160" y="88" text-anchor="middle" fill="#6B665F" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">TESTING REQUIRED</text>
  <text x="160" y="116" text-anchor="middle" fill="#8A847B" font-family="Arial, Helvetica, sans-serif" font-size="11">CPSIA/CPSC-related documents, where applicable</text>
