<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">Children's apparel compliance support visual</title>
  <desc id="desc">A neutral Allin Denim compliance visual for baby and children's apparel testing support, not an official certification logo.</desc>
  <rect width="640" height="320" rx="18" fill="#F6F8FA"/>
  <rect x="20" y="20" width="600" height="280" rx="16" fill="none" stroke="#CCD6E0" stroke-width="2"/>
  <circle cx="92" cy="86" r="38" fill="#173A63"/>
  <path d="M75 76c12-16 46-16 58 0v31c0 11-9 20-20 20H95c-11 0-20-9-20-20V76z" fill="#FFFFFF"/>
  <path d="M88 88h32M88 102h26" stroke="#173A63" stroke-width="5" stroke-linecap="round"/>
  <text x="148" y="76" fill="#071F3A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Baby &amp; Children's Apparel</text>
  <text x="148" y="110" fill="#173A63" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Additional testing support</text>
  <rect x="60" y="148" width="520" height="72" rx="12" fill="#FFFFFF" stroke="#D8D5CE"/>
  <text x="86" y="180" fill="#3E4C59" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Class I, CPSIA/CPSC-related testing, flammability</text>
  <text x="86" y="207" fill="#6B7280" font-family="Arial, Helvetica, sans-serif" font-size="14">Tracking labels and drawstring safety can be reviewed</text>
  <rect x="60" y="244" width="300" height="34" rx="17" fill="#EAF1F7"/>
  <text x="210" y="266" text-anchor="middle" fill="#173A63" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">TESTING BY DESTINATION MARKET</text>
  <text x="590" y="284" text-anchor="end" fill="#9A9288" font-family="Arial, Helvetica, sans-serif" font-size="11">Not an official logo</text>
</svg>
