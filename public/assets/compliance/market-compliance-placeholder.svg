<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">EU and US market compliance support visual</title>
  <desc id="desc">A neutral Allin Denim compliance visual for EU and US market requirements, not an official government seal.</desc>
  <rect width="640" height="320" rx="18" fill="#F8F7F4"/>
  <rect x="20" y="20" width="600" height="280" rx="16" fill="none" stroke="#D8D5CE" stroke-width="2"/>
  <circle cx="92" cy="86" r="38" fill="#173A63"/>
  <path d="M73 75h38v45H73zM81 87h22M81 100h22M81 113h14" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round"/>
  <text x="148" y="76" fill="#071F3A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">EU &amp; US Compliance</text>
  <text x="148" y="110" fill="#173A63" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Destination market documentation</text>
  <rect x="60" y="148" width="520" height="72" rx="12" fill="#FFFFFF" stroke="#D8D5CE"/>
  <text x="86" y="180" fill="#3E4C59" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">REACH, labeling, fiber composition, origin marking</text>
  <text x="86" y="207" fill="#6B7280" font-family="Arial, Helvetica, sans-serif" font-size="14">Reviewed according to product type and buyer market</text>
  <rect x="60" y="244" width="304" height="34" rx="17" fill="#EAF1F7"/>
  <text x="212" y="266" text-anchor="middle" fill="#173A63" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">MARKET REQUIREMENT REVIEW</text>
  <text x="590" y="284" text-anchor="end" fill="#9A9288" font-family="Arial, Helvetica, sans-serif" font-size="11">Not a government seal</text>
</svg>
