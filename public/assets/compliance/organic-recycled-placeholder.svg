<svg xmlns="http://www.w3.org/2000/svg" width="320" height="160" viewBox="0 0 320 160" role="img" aria-labelledby="title desc">
  <title id="title">Organic and recycled material standards logo placeholder</title>
  <desc id="desc">Neutral placeholder reserved for verified official GOTS, OCS, GRS, or RCS logo files.</desc>
  <rect width="320" height="160" rx="10" fill="#F8F7F4"/>
  <rect x="14" y="14" width="292" height="132" rx="8" fill="none" stroke="#D8D5CE" stroke-width="1.5" stroke-dasharray="6 8"/>
  <text x="160" y="61" text-anchor="middle" fill="#173A63" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">GOTS / OCS / GRS / RCS</text>
  <text x="160" y="91" text-anchor="middle" fill="#6B665F" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">DOCUMENTATION REQUIRED</text>
  <text x="160" y="118" text-anchor="middle" fill="#8A847B" font-family="Arial, Helvetica, sans-serif" font-size="11">Use only with verified scope and license details</text>
</svg>
