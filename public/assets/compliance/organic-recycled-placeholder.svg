<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">Organic and recycled material documentation support visual</title>
  <desc id="desc">A neutral Allin Denim compliance visual for organic and recycled material standards support, not an official certification logo.</desc>
  <rect width="640" height="320" rx="18" fill="#F8F7F4"/>
  <rect x="20" y="20" width="600" height="280" rx="16" fill="none" stroke="#D8D5CE" stroke-width="2"/>
  <circle cx="92" cy="86" r="38" fill="#173A63"/>
  <path d="M80 96c26-4 43-21 47-48-29 4-47 21-47 48z" fill="#FFFFFF"/>
  <path d="M83 95c10-13 24-24 41-34" fill="none" stroke="#173A63" stroke-width="4" stroke-linecap="round"/>
  <text x="148" y="76" fill="#071F3A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Organic &amp; Recycled</text>
  <text x="148" y="110" fill="#173A63" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">GOTS / OCS / GRS / RCS</text>
  <rect x="60" y="148" width="118" height="48" rx="12" fill="#FFFFFF" stroke="#D8D5CE"/>
  <text x="119" y="178" text-anchor="middle" fill="#173A63" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">GOTS</text>
  <rect x="194" y="148" width="118" height="48" rx="12" fill="#FFFFFF" stroke="#D8D5CE"/>
  <text x="253" y="178" text-anchor="middle" fill="#173A63" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">OCS</text>
  <rect x="328" y="148" width="118" height="48" rx="12" fill="#FFFFFF" stroke="#D8D5CE"/>
  <text x="387" y="178" text-anchor="middle" fill="#173A63" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">GRS</text>
  <rect x="462" y="148" width="118" height="48" rx="12" fill="#FFFFFF" stroke="#D8D5CE"/>
  <text x="521" y="178" text-anchor="middle" fill="#173A63" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">RCS</text>
  <text x="60" y="230" fill="#3E4C59" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Material claim documentation can be supported by scope</text>
  <rect x="60" y="250" width="278" height="34" rx="17" fill="#EAF1F7"/>
  <text x="199" y="272" text-anchor="middle" fill="#173A63" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">DOCUMENTATION UPON REQUEST</text>
  <text x="590" y="284" text-anchor="end" fill="#9A9288" font-family="Arial, Helvetica, sans-serif" font-size="11">Not official logos</text>
</svg>
