<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">OEKO-TEX Standard 100 documentation support visual</title>
  <desc id="desc">A neutral Allin Denim compliance visual for OEKO-TEX Standard 100 documentation support, not an official certification logo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F4F7"/>
    </linearGradient>
  </defs>
  <rect width="640" height="320" rx="18" fill="url(#bg)"/>
  <rect x="20" y="20" width="600" height="280" rx="16" fill="none" stroke="#C9D2DC" stroke-width="2"/>
  <circle cx="92" cy="86" r="38" fill="#173A63"/>
  <path d="M75 87l12 12 25-29" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="148" y="78" fill="#071F3A" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">OEKO-TEX</text>
  <text x="148" y="111" fill="#173A63" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Standard 100 support</text>
  <rect x="60" y="150" width="520" height="72" rx="12" fill="#FFFFFF" stroke="#D8D5CE"/>
  <text x="86" y="181" fill="#3E4C59" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Harmful substance testing documentation</text>
  <text x="86" y="207" fill="#6B7280" font-family="Arial, Helvetica, sans-serif" font-size="14">Close-to-skin apparel, underwear, babywear, socks</text>
  <rect x="60" y="244" width="254" height="34" rx="17" fill="#EAF1F7"/>
  <text x="187" y="266" text-anchor="middle" fill="#173A63" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">AVAILABLE UPON REQUEST</text>
  <text x="590" y="284" text-anchor="end" fill="#9A9288" font-family="Arial, Helvetica, sans-serif" font-size="11">Not an official logo</text>
</svg>
